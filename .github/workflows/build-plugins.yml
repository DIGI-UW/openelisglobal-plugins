name: Build OpenELIS-Global-2 Plugins
on:
  release:
    types: [published] 
    
jobs:
  build-and-upload-plugins:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 11
        uses: actions/setup-java@v1
        with:
          java-version: 11 
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
              ${{ runner.os }}-maven- 
      
      - name: Checkout openelisglobal-plugins
        uses: actions/checkout@v2
        with:
          repository: ${{github.repository}} 

      - name: Build openelisglobal-plugins
        run: mvn clean install  

      - name: check plugins
        run: ls plugins  

      - name: Compress Folder
        run: |
          tar -czf plugins.tar.gz -C plugins .
          ls -lh plugins.tar.gz  # Verify the TAR file is created
          echo "FILE_PATH=plugin.tar.gz" >> $GITHUB_ENV
          echo "FILE_NAME=plugin.tar.gz" >> $GITHUB_ENV   

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ${{ env.FILE_PATH }}
          asset_name: ${{ env.FILE_NAME }}
          asset_content_type: application/gzip  
 
