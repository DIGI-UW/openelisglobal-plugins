name: openelisglobal-plugins CI Build
on:
  push:
    branches: [develop, feat/011-horiba-pentra60-micros60]
  pull_request:
    branches: [develop, feat/011-horiba-pentra60-micros60]
  workflow_dispatch:

# TEMPORARY: GenericASTM/GenericHL7 plugins require AnalyzerService.findByIdentifierPatternMatch()
# and the merged 2-table model (analyzer_configuration merged into analyzer), which exists on
# fix/011-sync-remediation but not yet on feat/011 or develop.
#
# EXIT CRITERIA: Revert to OE 'feat/011-madagascar-analyzer-integration' once PR #2802
# (fix/011-sync-remediation) is merged, then revert to 'develop' once feat/011 merges.
#
# Tracking: specs/011-madagascar-analyzer-integration (OE repo)
env:
  OE_REF: fix/011-sync-remediation

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-plugins-${{ hashFiles('**/pom.xml') }}-oe-${{ env.OE_REF }}
          restore-keys: |
            ${{ runner.os }}-maven-plugins-

      - name: Checkout openelisglobal-plugins
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}

      - name: Checkout OpenELIS-Global-2
        uses: actions/checkout@v4
        with:
          repository: DIGI-UW/OpenELIS-Global-2
          ref: ${{ env.OE_REF }}
          path: openelis-global-2
          submodules: recursive

      - name: Build dataexport
        working-directory: openelis-global-2/dataexport
        run: mvn clean install -DskipTests -Dmaven.test.skip=true

      - name: Build and install OpenELIS-Global-2
        working-directory: openelis-global-2
        run: mvn clean install -DskipTests -Dspotless.check.skip=true

      - name: Build openelisglobal-plugins
        run: mvn clean install -DskipTests
